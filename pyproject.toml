[project]
name = "cmcoder"
version = "0.2.0"
description = "Agentic coding assistant built on LangChain v1 and LangGraph, for OpenAI-compatible model gateways"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # --- LangChain / LangGraph stack (the engine) ---
    "langgraph>=1.2,<2",                    # graph runtime: state, checkpoints, interrupts, streaming
    "langchain>=1.4,<2",                    # create_agent + middleware
    "langchain-core>=1.6,<2",               # messages, tools, chat-model and vector-store interfaces
    "langchain-openai>=1.7,<2",             # ChatOpenAI against any OpenAI-compatible gateway
    "langgraph-checkpoint-sqlite>=3.1,<4",  # durable sessions: AsyncSqliteSaver
    "aiosqlite>=0.20",                      # its async SQLite driver (we also keep an index table)
    # --- carried over from cmcoderagent ---
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "prompt-toolkit>=3.0.43",
    "truststore>=0.9",
    "keyring>=25",
    "pathspec>=0.12",
    "pillow>=10",
    "langchain-mcp-adapters>=0.3,<0.4",
    "numpy>=2.1",
    "playwright>=1.56,<2",
]

[project.scripts]
cmcoder = "cmcoder.cli.main:run"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "pyright>=1.1.370",
    "pexpect>=4.9; sys_platform != 'win32'",  # REPL tests in a pseudo-terminal
    "defusedxml>=0.7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cmcoder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["evals/tasks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["E501", "SIM105", "ASYNC109"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
